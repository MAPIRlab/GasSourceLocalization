$(var namespace):
  amcl:
    ros__parameters:
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2
      base_frame_id: "$(var namespace)_base_footprint"
      beam_skip_distance: 0.5
      beam_skip_error_threshold: 0.9
      beam_skip_threshold: 0.3
      do_beamskip: false
      global_frame_id: "map"
      lambda_short: 0.1
      laser_likelihood_max_dist: 2.0
      laser_max_range: 100.0
      laser_min_range: -1.0
      laser_model_type: "likelihood_field"
      max_beams: 60
      max_particles: 2000
      min_particles: 500
      odom_frame_id: "$(var namespace)_odom"
      pf_err: 0.05
      pf_z: 0.99
      recovery_alpha_fast: 0.0
      recovery_alpha_slow: 0.0
      resample_interval: 1
      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      save_pose_rate: 0.5
      sigma_hit: 0.2
      tf_broadcast: true
      transform_tolerance: 1.0
      update_min_a: 0.2
      update_min_d: 0.25
      z_hit: 0.5
      z_max: 0.05
      z_rand: 0.5
      z_short: 0.05
      scan_topic: scan
      
  bt_navigator:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: $(var namespace)_base_link
      odom_topic: $(var namespace)/odom
      bt_loop_duration: 10
      default_server_timeout: 20
      navigators: ["navigate_to_pose", "navigate_through_poses"]
      navigate_to_pose:
        plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      navigate_through_poses:
        plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      goal_blackboard_id: goal
      goals_blackboard_id: goals
      path_blackboard_id: path

  controller_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 20.0
      failure_tolerance: 1.0
      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
      controller_plugins: ["FollowPath"]

      # Progress checker parameters
      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0
      general_goal_checker:
        stateful: True
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.1
      FollowPath:
        plugin: "nav2_rotation_shim_controller::RotationShimController"
        primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        
        # --- Parámetros del SHIM  ---
        angular_dist_threshold: 0.785
        forward_sampling_distance: 0.5
        angular_disengage_threshold: 0.3925
        rotate_to_heading_angular_vel: 1.0
        max_angular_accel: 3.2
        max_cost_threshold: 254.0
        simulate_ahead_time: 1.0
        rotate_to_goal_heading: true
        closed_loop: false

        # --- Parámetros de Regulated Pure Pursuit ---
        desired_linear_vel: 1.0
        min_linear_vel: -0.0
        max_angular_vel: 2.5
        min_angular_vel: -2.5
        max_linear_accel: 2.5
        max_linear_decel: -2.5
        max_angular_accel: 3.2
        max_angular_decel: -3.2
        lookahead_dist: 0.6
        min_lookahead_dist: 0.3
        max_lookahead_dist: 0.9
        lookahead_time: 1.5
        rotate_to_heading_angular_vel: 1.8
        use_velocity_scaled_lookahead_dist: false
        min_approach_linear_velocity: 0.1
        approach_velocity_scaling_dist: 0.4
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0
        use_regulated_linear_velocity_scaling: true
        use_fixed_curvature_lookahead: false
        curvature_lookahead_dist: 0.25
        use_cost_regulated_linear_velocity_scaling: false
        cost_scaling_dist: 0.3
        cost_scaling_gain: 1.0
        regulated_linear_scaling_min_radius: 0.9
        regulated_linear_scaling_min_speed: 0.25
        use_rotate_to_heading: false
        allow_reversing: false
        use_dynamic_window: true
        allow_obstacle_checking_beyond_goal: false

      velocity_smoother:
        plugin: "nav2_velocity_smoother::VelocitySmoother"
        smoothing_frequency: 20.0
        scale_velocities: false
        # Usa CLOSED_LOOP si tu odometría es buena; ayuda a amortiguar inversión de signo
        feedback: "CLOSED_LOOP"             # antes OPEN_LOOP
        max_velocity: [2.0, 0.0, 1.0]
        min_velocity: [-0.2, 0.0, -0.1]     # antes 0.1
        max_accel: [0.2, 0.0, 0.5]
        max_decel: [-0.4, 0.0, -2.5]        # Incremented Z decel from -0.5 to -2.5 so it can brake fast
        deadband_velocity: [0.02, 0.0, 0.05]  # antes 0.1
        velocity_timeout: 1.0

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: $(var namespace)_odom
        robot_base_frame: $(var namespace)_base_link
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.05
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          observation_sources: "scan"
          scan:
            topic: /$(var namespace)/laser_scanner
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
        always_send_full_costmap: True

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: $(var namespace)_base_link
        robot_radius: 0.22
        resolution: 0.05
        track_unknown_space: true
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: $(var namespace)/laser_scanner
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
        always_send_full_costmap: True

  planner_server:
    ros__parameters:
      expected_planner_frequency: 20.0
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.2
        use_astar: false
        allow_unknown: false

  behavior_server:
    ros__parameters:
      local_costmap_topic: $(var namespace)/local_costmap/costmap_raw
      global_costmap_topic: $(var namespace)/global_costmap/costmap_raw
      local_footprint_topic: $(var namespace)/local_costmap/published_footprint
      global_footprint_topic: $(var namespace)/global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      drive_on_heading:
        plugin: "nav2_behaviors::DriveOnHeading"
      wait:
        plugin: "nav2_behaviors::Wait"
      assisted_teleop:
        plugin: "nav2_behaviors::AssistedTeleop"
      local_frame: $(var namespace)_odom
      global_frame: map
      robot_base_frame: $(var namespace)_base_link
      transform_tolerance: 0.1
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 3.2
